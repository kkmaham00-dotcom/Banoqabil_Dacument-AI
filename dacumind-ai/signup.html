<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Dacumind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-card {
      background-color: var(--bg-secondary);
      padding: 40px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .login-btn {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <a href="index.html" class="navbar-brand" style="display: block; margin-bottom: 30px; font-size: 2rem;">Dacumind<span style="color: var(--accent-color);">.ai</span></a>
      
      <h2 style="margin-bottom: 20px;">Create an Account</h2>
      
      <form action="dashboard.html">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" required placeholder="Jane Doe">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn btn-primary login-btn">Sign Up</button>
      </form>
      
      <p class="text-muted" style="margin-top: 20px; font-size: 0.9rem;">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

</body>
</html>
